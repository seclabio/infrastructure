volumes:
  ghostwriter-postgres-data: {}
  ghostwriter-postgres-data-backups: {}
  ghostwriter-staticfiles: {}
  ghostwriter-media: {}

services:
  django: &django
    image: ghcr.io/seclabio/ghostwriter_django:v7.2.7-V0.0.5
    container_name: ghostwriter-django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      name: ghostwriter_django
    environment:
      - USE_DOCKER=${USE_DOCKER}
      - IPYTHONDIR=${IPYTHONDIR}
      - SPACY_MODEL=${SPACY_MODEL:-en_core_web_sm}
      - SPACY_DOWNLOAD_MISSING_MODEL=${SPACY_DOWNLOAD_MISSING_MODEL:-0}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_MFA_ALWAYS_REVEAL_BACKUP_TOKENS=${DJANGO_MFA_ALWAYS_REVEAL_BACKUP_TOKENS}
      - DJANGO_MFA_PASSKEY_LOGIN_ENABLED=${DJANGO_MFA_PASSKEY_LOGIN_ENABLED:-true}
      - DJANGO_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_ACCOUNT_ALLOW_REGISTRATION}
      - DJANGO_ACCOUNT_EMAIL_VERIFICATION=${DJANGO_ACCOUNT_EMAIL_VERIFICATION}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_CSRF_COOKIE_SECURE=${DJANGO_CSRF_COOKIE_SECURE}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS}
      - DJANGO_DATE_FORMAT=${DJANGO_DATE_FORMAT}
      - DJANGO_JWT_SECRET_KEY=${DJANGO_JWT_SECRET_KEY}
      - DJANGO_QCLUSTER_NAME=${DJANGO_QCLUSTER_NAME}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT}
      - DJANGO_SESSION_COOKIE_AGE=${DJANGO_SESSION_COOKIE_AGE}
      - DJANGO_SESSION_COOKIE_SECURE=${DJANGO_SESSION_COOKIE_SECURE}
      - DJANGO_SESSION_EXPIRE_AT_BROWSER_CLOSE=${DJANGO_SESSION_EXPIRE_AT_BROWSER_CLOSE}
      - DJANGO_SESSION_SAVE_EVERY_REQUEST=${DJANGO_SESSION_SAVE_EVERY_REQUEST}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SOCIAL_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_SOCIAL_ACCOUNT_ALLOW_REGISTRATION}
      - DJANGO_SOCIAL_ACCOUNT_DOMAIN_ALLOWLIST=${DJANGO_SOCIAL_ACCOUNT_DOMAIN_ALLOWLIST}
      - DJANGO_SOCIAL_ACCOUNT_LOGIN_ON_GET=${DJANGO_SOCIAL_ACCOUNT_LOGIN_ON_GET}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - HASURA_ACTION_SECRET=${HASURA_GRAPHQL_ACTION_SECRET}
      - HASURA_GRAPHQL_SERVER_HOSTNAME=${HASURA_GRAPHQL_SERVER_HOSTNAME}
      - OIDC_SERVER_URL=${OIDC_SERVER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - HEALTHCHECK_DISK_USAGE_MAX=${HEALTHCHECK_DISK_USAGE_MAX}
      - HEALTHCHECK_MEM_MIN=${HEALTHCHECK_MEM_MIN}
      - MAILGUN_API_KEY=${DJANGO_MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${DJANGO_MAILGUN_DOMAIN}
      - NO_PROXY=graphql_engine
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - WEB_CONCURRENCY=${DJANGO_WEB_CONCURRENCY}
      - GHOSTWRITER_MAX_FILE_SIZE=${GHOSTWRITER_MAX_FILE_SIZE:-10485760}
    healthcheck:
      test: curl --fail http://nginx/status/simple/ || exit 1
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START}
    command: /start
    volumes:
      - ghostwriter-staticfiles:/app/staticfiles
      - ghostwriter-media:/app/ghostwriter/media
      - ./settings_override.py:/app/config/settings/production.d/z_override.py:ro
    networks:
      - internal

  postgres:
    image: ghcr.io/seclabio/ghostwriter_postgres:v7.2.7-V0.0.5
    container_name: ghostwriter-postgres
    restart: unless-stopped
    volumes:
      - ghostwriter-postgres-data:/var/lib/postgresql/data
      - ghostwriter-postgres-data-backups:/backups
    labels:
      name: ghostwriter_postgres
    environment:
      - NO_PROXY=django,graphql_engine
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
    healthcheck:
      test: pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START}
    networks:
      - internal

  nginx:
    image: ghcr.io/seclabio/ghostwriter_nginx:v7.2.7-V0.0.5
    container_name: ghostwriter-nginx
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - ghostwriter-media:/app/media
      - ghostwriter-staticfiles:/app/staticfiles
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      name: ghostwriter_nginx
    environment:
      - NO_PROXY=django,graphql_engine
    healthcheck:
      test: curl --fail http://localhost/accounts/login || exit 1
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START}
    networks:
      internal:
      pangolin_net:
        aliases:
          - ghostwriter-nginx

  redis:
    image: ghcr.io/seclabio/ghostwriter_redis:v7.2.7-V0.0.5
    container_name: ghostwriter-redis
    labels:
      name: ghostwriter_redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli --raw incr ping || exit 1
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START}
    networks:
      - internal

  queue:
    <<: *django
    container_name: ghostwriter-queue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      name: ghostwriter_queue
    command: /start-queue

  graphql_engine:
    image: ghcr.io/seclabio/ghostwriter_hasura:v7.2.7-V0.0.5
    container_name: ghostwriter-graphql-engine
    depends_on:
      postgres:
        condition: service_healthy
      django:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./ssl:/etc/ssl/certs
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "10m"
    labels:
      name: ghostwriter_graphql
    environment:
      - ACTIONS_URL_BASE=http://django:8000/api
      - HASURA_ACTION_SECRET=${HASURA_GRAPHQL_ACTION_SECRET}
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET}
      - HASURA_GRAPHQL_AUTH_HOOK=http://django:8000/api/webhook
      - HASURA_GRAPHQL_CONSOLE_ASSETS_DIR=/srv/console-assets
      - HASURA_GRAPHQL_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - HASURA_GRAPHQL_DEV_MODE=${HASURA_GRAPHQL_DEV_MODE}
      - HASURA_GRAPHQL_ENABLE_CONSOLE=${HASURA_GRAPHQL_ENABLE_CONSOLE}
      - HASURA_GRAPHQL_ENABLED_LOG_TYPES=${HASURA_GRAPHQL_ENABLED_LOG_TYPES}
      - HASURA_GRAPHQL_ENABLE_TELEMETRY=${HASURA_GRAPHQL_ENABLE_TELEMETRY}
      - HASURA_GRAPHQL_INSECURE_SKIP_TLS_VERIFY=${HASURA_GRAPHQL_INSECURE_SKIP_TLS_VERIFY}
      - HASURA_GRAPHQL_LOG_LEVEL=${HASURA_GRAPHQL_LOG_LEVEL}
      - HASURA_GRAPHQL_METADATA_DIR=${HASURA_GRAPHQL_METADATA_DIR}
      - HASURA_GRAPHQL_MIGRATIONS_DIR=${HASURA_GRAPHQL_MIGRATIONS_DIR}
      - HASURA_GRAPHQL_SERVER_PORT=${HASURA_GRAPHQL_SERVER_PORT}
      - NO_PROXY=django
    healthcheck:
      test: curl --insecure --fail http://graphql_engine:8080/healthz || exit 1
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START}
    networks:
      - internal

  collab-server:
    image: ghcr.io/seclabio/ghostwriter_collab_server:v7.2.7-V0.0.5
    container_name: ghostwriter-collab-server
    restart: unless-stopped
    depends_on:
      - graphql_engine
      - django
    labels:
      name: ghostwriter_collab
    environment:
      - HASURA_ACTION_SECRET=${HASURA_GRAPHQL_ACTION_SECRET}
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET}
      - HASURA_GRAPHQL_SERVER_HOSTNAME=${HASURA_GRAPHQL_SERVER_HOSTNAME}
    networks:
      - internal

  talboot:
    image: ghcr.io/negativefeedback/tailboot:latest
    container_name: ghostwriter-talboot
    restart: unless-stopped
    labels:
      name: ghostwriter_talboot
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "10m"
    networks:
      - internal

networks:
  internal:
  pangolin_net:
    external: true
